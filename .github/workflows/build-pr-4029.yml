name: Build cmux PR 4029 Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit to build
        required: true
        default: d56e9937b8d7a5e669fea67ef668dce4924ef5ae
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CMUX_SKIP_ZIG_BUILD: "1"
    steps:
      - name: Checkout PR source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Verify source commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_ref }}"
          git submodule status

      - name: Select Xcode
        run: |
          set -euo pipefail
          selection="$(python3 - <<'EOF'
          import glob, os, subprocess

          pin = open(".xcode-version").read().strip()

          def key(v):
              return tuple(int(x) for x in (v.split(".") + ["0", "0"])[:3])

          apps = []
          for app in sorted(glob.glob("/Applications/Xcode*.app")):
              pl = os.path.join(app, "Contents", "Info.plist")
              r = subprocess.run(
                  ["/usr/libexec/PlistBuddy", "-c", "Print :CFBundleShortVersionString", pl],
                  capture_output=True, text=True)
              ver = r.stdout.strip()
              if not ver:
                  continue
              print(f"Found: {app} ({ver})")
              apps.append((key(ver), app))

          strict = [(k, a) for k, a in apps if k[:2] == key(pin)[:2]]
          if strict:
              best = max(strict)
              print(f"Selected Xcode {pin}.x line: {best[1]}")
          else:
              loose = [(k, a) for k, a in apps if k[0] == key(pin)[0]]
              if not loose:
                  print(f"::error::No Xcode {pin}.x found on runner (see list above)")
                  raise SystemExit(1)
              best = max(loose)
              print(f"::warning::No Xcode {pin} exact line on runner; falling back to {best[1]}")
          print(f"XCODE_APP={best[1]}")
          EOF
          )"
          echo "$selection"
          xcode_app="$(printf '%s\n' "$selection" | sed -n 's/^XCODE_APP=//p')"
          test -n "$xcode_app"
          xcode_dir="$xcode_app/Contents/Developer"
          echo "DEVELOPER_DIR=$xcode_dir" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$xcode_dir"
          xcodebuild -version

      - name: Download pre-built GhosttyKit.xcframework
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Build release app
        id: build
        run: |
          set -euo pipefail
          echo "=== runner facts ==="
          sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu
          df -h /
          set +e
          xcodebuild -scheme cmux -configuration Release \
            -derivedDataPath build-release \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcbuild.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "=== xcodebuild exit code: $rc ==="
          grep -E "error:|The following build commands failed|BUILD FAILED|BUILD SUCCEEDED" xcbuild.log | tail -n 60 || true
          if [ "$rc" -ne 0 ]; then
            echo "=== last 150 lines of xcbuild.log ==="
            tail -n 150 xcbuild.log || true
            echo "=== disk after failure ==="
            df -h /
            exit "$rc"
          fi
          app_path="$PWD/build-release/Build/Products/Release/cmux.app"
          test -d "$app_path"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Contents/Info.plist")" = "0.64.22"

          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/cmuxd-remote-manifest.json" \
            https://github.com/manaflow-ai/cmux/releases/download/v0.64.22/cmuxd-remote-manifest.json
          manifest_json="$(python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1], encoding="utf-8")), separators=(",", ":")))' "$RUNNER_TEMP/cmuxd-remote-manifest.json")"
          plutil -remove CMUXRemoteDaemonManifestJSON "$app_path/Contents/Info.plist" >/dev/null 2>&1 || true
          plutil -insert CMUXRemoteDaemonManifestJSON -string "$manifest_json" "$app_path/Contents/Info.plist"
          plutil -replace SUFeedURL -string https://github.com/manaflow-ai/cmux/releases/download/v0.64.22/appcast.xml "$app_path/Contents/Info.plist"

          /usr/bin/codesign --force --deep --sign - "$app_path"
          echo "app_path=$app_path" >> "$GITHUB_OUTPUT"
          mkdir -p artifact
          ditto -c -k --sequesterRsrc --keepParent "$app_path" artifact/cmux-pr-4029.app.zip
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "app_path=$app_path"
            echo "app_bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")"
            echo "app_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$app_path/Contents/Info.plist")"
            echo "update_feed=$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$app_path/Contents/Info.plist")"
            echo "auth_callback_scheme=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:1:CFBundleURLSchemes:0' "$app_path/Contents/Info.plist")"
            echo "remote_daemon_manifest_version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["appVersion"])' "$RUNNER_TEMP/cmuxd-remote-manifest.json")"
          } > artifact/build-info.txt
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app_path"
          /usr/bin/codesign -dvv "$app_path" 2> artifact/codesign.txt || true

      - name: Upload app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cmux-pr-4029
          path: artifact/
          retention-days: 14
          if-no-files-found: error
